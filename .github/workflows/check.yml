jobs:
  check:
    name: Check flake
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Install Lix
      uses: samueldr/lix-gha-installer-action@v2026-06-15
      with:
        extra_nix_config: |-
          accept-flake-config = true
          max-jobs = auto
    - name: Add SSH keys to ssh-agent
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: |-
          ${{ secrets.SECRETS_DEPLOY_KEY }}
          ${{ secrets.PRAGMATAPRO_DEPLOY_KEY }}
    - name: Setup Attic cache
      uses: ryanccn/attic-action@2071ebde9bf7616058f8556c809c8947c4963de6
      with:
        cache: tilde
        endpoint: https://cache.e10.camp
        token: ${{ secrets.ATTIC_TOKEN }}
    - name: Use Cachix store
      uses: cachix/cachix-action@v17
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        installCommand: nix profile install github:NixOS/nixpkgs/nixpkgs-unstable#cachix
        name: tilde
    - name: Run check flake
      run: nix flake -Lv check --impure --show-trace
name: Check
'on':
  push: {}
  workflow_dispatch: {}
