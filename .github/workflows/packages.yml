jobs:
  build-package:
    name: Build package
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install Lix
      uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d
      with:
        extra_nix_config: |-
          accept-flake-config = true
          max-jobs = auto
    - name: Add SSH keys to ssh-agent
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
      with:
        ssh-private-key: |-
          ${{ secrets.SECRETS_DEPLOY_KEY }}
          ${{ secrets.PRAGMATAPRO_DEPLOY_KEY }}
    - name: Setup Attic cache
      uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a
      with:
        cache: tilde
        endpoint: https://cache.e10.camp
        token: ${{ secrets.ATTIC_TOKEN }}
    - name: Use Cachix store
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        installCommand: nix profile install github:NixOS/nixpkgs/nixpkgs-unstable#cachix
        name: tilde
    - name: Build ${{ matrix.package }} (${{ matrix.architecture }}) package
      run: nix build .#packages.${{ matrix.architecture }}.${{ matrix.package }} --keep-going
        --print-build-logs --show-trace --verbose
    strategy:
      matrix:
        architecture:
        - aarch64-darwin
        package:
        - firehydrant-mcp
        - mcp-remote
        - oh-my-tmux
        - postgres-mcp
        - sf-pro
name: Build packages
'on':
  push:
    paths:
    - .github/**/*.yml
    - modules/packages/**/*.nix
    - flake.lock
